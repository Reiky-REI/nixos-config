# ===== Hyprland 开机启动项 =====
#
# 公共启动项 (niri 和 hyprland 共用) 已在各 WM 配置中分别声明。
# 如需修改公共项，请同步更新 niri/config.kdl。
#
# 优化原则:
#   - 系统服务 (pipewire 等) 由 systemd 管理，不在 WM 层启动
#   - 用户服务 (swaync 等) 由 home-manager 管理，不在 WM 层启动
#   - 仅在登录时需要的东西才放这里

# ===== 1. Wayland 会话环境 =====
# (hyprland 独有，niri 不需要)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ===== 2. 桌面门户 =====
exec-once = xdg-desktop-portal-hyprland
exec-once = xdg-desktop-portal
exec-once = xdg-desktop-portal-hyprland --force-global
# exec-once = systemctl --user start hyprpolkitagent

# ===== 3. 公共后台服务 =====
# （以下项在 niri/config.kdl 中也有声明，修改时请同步）
exec-once = nm-applet                    # 网络管理托盘
exec-once = waybar                       # 状态栏 (hyprland 用)
exec-once = swww-daemon                  # 壁纸守护
exec-once = wayvnc 0.0.0.0              # 远程桌面
exec-once = fcitx5                       # 输入法
