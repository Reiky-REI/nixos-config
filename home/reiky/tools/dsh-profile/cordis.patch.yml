# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# 「NixOS 守夜人」驾驶舱(nxwatch):
# 宿主半注册 /plugins/nxwatch/* 元数据与壁纸资源路由;
# 浏览器半在 conversation.composer.dock 注册状态条与展开面板,
# 仅当当前会话预设为 nixos-guard 时渲染。
# 插件包: ~/WorkSpace/nxwatch(profile 依赖 file: 安装)。
- insert:
    - id: nxwatch
      name: 'nxwatch'

# 统一 DeepSec 安全守卫(dsh-deepsec-guard):
# 在 agent/pre-step(入站消息)与 tools/pre-execute(工具参数)调用 deepsec-guard,
# 命中恶意提示词/高危则拦截。引擎统一为 DeepSec。
# 插件包: ~/WorkSpace/dsh-deepsec-guard(profile 依赖 file: 安装)。
- insert:
    - id: dsh-deepsec-guard
      name: 'dsh-deepsec-guard'
      config:
        enabled: true
        toolNames:
          - bash
          - persistent-bash
          - terminal-bash
          - str-replace-editor
          - edit
        scanPreStep: true
        scanPostExecute: false
        allowOnError: true
        timeoutMs: 12000

# DeepSec Shield/Spear 工具(dsh-plugins/, 上游 rev fff031f):
# Shield = 防御侧代码审计(scan/agent-audit/supply-chain/report);
# Spear = 授权渗透(recon/run, 签名作用域/时间窗/目标成员由 CLI 侧强制)。
# 这两个插件自带 dsh.bundle.patch, 但 dsh 0.1.1-rc.2 不自动并入, 故显式 insert。
# command 用绝对路径, 因 dsh-fence 服务 PATH 不含用户 profile。
# 插件包: ~/WorkSpace/DeepSec/dsh-plugins/{deepsec-shield,deepsec-spear}(file: 安装)。
- insert:
    - id: deepsec-shield
      name: 'dsh-deepsec-shield'
      config:
        command: /home/reiky/WorkSpace/bin/deepsec
        timeoutMs: 600000
- insert:
    - id: deepsec-spear
      name: 'dsh-deepsec-spear'
      config:
        command: /home/reiky/WorkSpace/bin/deepsec
        timeoutMs: 3600000
